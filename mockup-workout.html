<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя тренировка — макет</title>
<style>
:root{--bg:#070707;--panel:#151515;--panel2:#202020;--line:#303030;--text:#f5f5f5;--muted:#898989;--lime:#c8ff12;--lime2:#a9e900;--red:#ff5b73;--blue:#75a9ff}*{box-sizing:border-box}body{margin:0;background:#2c2c2c;color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh}.phone{width:min(100vw,420px);height:min(920px,100vh);min-height:760px;background:var(--bg);overflow:hidden;position:relative;border:8px solid #111;border-radius:38px;box-shadow:0 28px 80px #0009}.screen{height:100%;overflow:auto;padding:42px 18px 105px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.top h1{font-size:20px;letter-spacing:.08em;margin:0;text-align:center;text-transform:uppercase}.icon{width:42px;height:42px;border:1px solid #454545;border-radius:50%;display:grid;place-items:center;background:#111;color:var(--text);font-size:21px}.back{font-size:27px}.eyebrow{color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:22px 0 11px}.section-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.section-title h2{margin:0;font-size:25px;letter-spacing:.02em}.section-title span{color:var(--lime);font-size:12px}.card{background:linear-gradient(145deg,#1b1b1b,#101010);border:1px solid #303030;border-radius:20px;padding:13px;margin:10px 0;box-shadow:0 8px 22px #0005}.card.exercise{display:flex;gap:12px;align-items:center;cursor:pointer}.avatar{width:62px;height:62px;flex:0 0 62px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f5e6bd 0 12%,transparent 13%),radial-gradient(circle at 50% 67%,#b8b8b8 0 20%,transparent 21%),linear-gradient(145deg,#3f5365,#111);border:3px solid #64778b;position:relative}.avatar:after{content:'●';color:var(--lime);position:absolute;right:-2px;bottom:0;font-size:12px}.card h3{margin:0 0 7px;font-size:16px;line-height:1.15}.meta{font-size:13px;color:#aaa}.weight{display:inline-block;color:var(--lime);background:#273006;border-radius:8px;padding:4px 7px;margin-left:5px}.more{margin-left:auto;color:#777;font-size:22px}.statline{display:flex;gap:8px;color:var(--muted);font-size:13px;margin:16px 0}.start{position:fixed;bottom:73px;left:50%;transform:translateX(-50%);width:min(calc(100vw - 52px),350px);border:0;border-radius:16px;background:var(--lime);color:#0b0b0b;font-weight:800;letter-spacing:.08em;padding:17px;font-size:14px;box-shadow:0 8px 28px #c8ff1240}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#111;border-top:1px solid #292929;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.tab{display:grid;place-items:center;align-content:center;gap:5px;color:#777;font-size:11px}.tab b{font-size:21px;font-weight:400}.tab.active{color:var(--lime)}.hero{text-align:center;padding:4px 0 18px}.big-avatar{width:142px;height:142px;margin:8px auto 18px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#f5e6bd 0 10%,transparent 11%),radial-gradient(circle at 50% 65%,#aaa 0 25%,transparent 26%),linear-gradient(145deg,#3d546d,#0c0c0c);border:5px solid #687a8c;box-shadow:0 0 0 8px #1b1b1b}.hero h2{font-size:25px;line-height:1.05;letter-spacing:.04em;margin:0 0 7px;text-transform:uppercase}.hero p{color:var(--muted);margin:0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.action{background:#191919;border:1px solid #373737;border-radius:13px;color:#ddd;padding:12px 5px;font-size:11px}.action:first-child{border-color:var(--lime);color:var(--lime)}.action span{display:block;font-size:19px;margin-bottom:5px}.sets{border-top:1px solid var(--line)}.set-row{display:grid;grid-template-columns:28px 1fr 1fr 42px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #292929}.set-no{color:var(--muted);font-size:13px}.input{background:#202020;border:1px solid #3b3b3b;border-radius:10px;color:var(--text);padding:11px 7px;text-align:center;font-size:15px}.check{width:38px;height:38px;border-radius:50%;border:1px solid #555;background:#191919;color:#777;font-size:18px}.check.done{background:var(--lime);border-color:var(--lime);color:#000}.addset{width:100%;border:1px dashed #555;background:transparent;color:#aaa;border-radius:12px;padding:13px;margin-top:14px}.pager{display:flex;justify-content:space-between;align-items:center;margin:18px 0;color:var(--muted)}.pager strong{color:#fff;font-size:12px}.sheet{position:absolute;inset:0;background:#0008;display:none;align-items:end}.sheet.open{display:flex}.sheetbox{background:#1a1a1a;border-top:1px solid #444;border-radius:24px 24px 0 0;width:100%;padding:20px 18px 30px;max-height:72%;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheethead h3{margin:0;font-size:23px}.close{background:none;border:0;color:#aaa;font-size:25px}.choice{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303030;padding:15px 0}.choice small{color:var(--muted);display:block;margin-top:4px}.radio{width:20px;height:20px;border:2px solid #777;border-radius:50%}.radio.selected{border:6px solid var(--lime)}.hidden{display:none!important}@media(max-height:800px){.phone{min-height:100vh;border-width:0;border-radius:0}}
</style>
</head>
<body>
<div class="phone">
  <main id="home" class="screen">
    <header class="top"><button class="icon back">‹</button><h1>Тяни–толкай</h1><button class="icon">☷</button></header>
    <div class="statline"><span>День А</span><span>•</span><span>Тяжёлая неделя</span><span>•</span><span style="color:var(--lime)">3 / 8</span></div>
    <div class="eyebrow">Кардио</div>
    <div class="card exercise"><div class="avatar">◷</div><div><h3>Ходьба на дорожке</h3><div class="meta">10 минут</div></div><div class="more">⋯</div></div>
    <div class="section-title"><h2>Упражнения</h2><span>8 всего</span></div>
    <div id="exerciseList"></div>
    <button class="start" onclick="openExercise()">НАЧАТЬ ДЕНЬ А</button>
  </main>
  <main id="exercise" class="screen hidden">
    <header class="top"><button class="icon back" onclick="goHome()">‹</button><h1>Упражнение</h1><button class="icon">⚙</button></header>
    <section class="hero"><div class="big-avatar"></div><h2>Жим лёжа в Смите</h2><p>Грудь · основное упражнение</p></section>
    <div class="actions"><button class="action" onclick="openSheet('tech')"><span>▶</span>Техника</button><button class="action" onclick="openSheet('history')"><span>◷</span>История</button><button class="action" onclick="openSheet('replace')"><span>⇄</span>Заменить</button></div>
    <div class="set-row" style="border-top:1px solid var(--line);color:var(--muted);font-size:11px"><span>№</span><span style="text-align:center">ВЕС, КГ</span><span style="text-align:center">ПОВТ.</span><span>✓</span></div>
    <div class="sets" id="sets"></div><button class="addset">＋ ЕЩЁ ПОДХОД</button>
    <div class="pager"><span>← Предыдущее</span><strong>Жим гантелей на наклонной</strong><span>Следующее →</span></div>
  </main>
  <nav class="tabs"><div class="tab active" onclick="goHome()"><b>⌂</b>Дневник</div><div class="tab"><b>◷</b>История</div><div class="tab"><b>▥</b>Прогресс</div><div class="tab"><b>□</b>Календарь</div></nav>
  <div id="sheet" class="sheet" onclick="if(event.target===this)closeSheet()"><section class="sheetbox"><div class="sheethead"><h3 id="sheetTitle">История</h3><button class="close" onclick="closeSheet()">×</button></div><div id="sheetContent"></div></section></div>
</div>
<script>
const exercises=['Жим лёжа в Смите','Жим гантелей на наклонной скамье','Разводка в тренажёре бабочка','Разгибание рук с канатом','Разгибание рук из-за головы на блоке','Французский жим','Жим гантелей сидя','Пресс'];
const lastData=[['45 кг','10'],['32,5 кг','12'],['60 кг','10'],['25 кг','12'],['30 кг','10'],['15 кг','12'],['12,5 кг','10'],['—','—']];const list=document.getElementById('exerciseList');list.innerHTML=exercises.map((x,i)=>`<article class="card exercise" onclick="${i===0?'openExercise()':''}"><div class="avatar"></div><div><h3>${x}</h3><div class="meta">3 × 10–12 повторений</div><div class="meta" style="color:var(--lime);margin-top:5px">Последний раз: ${lastData[i][0]} × ${lastData[i][1]}</div></div><div class="more">⋯</div></article>`).join('');
const sets=document.getElementById('sets');for(let i=1;i<=3;i++)sets.insertAdjacentHTML('beforeend',`<div class="set-row"><span class="set-no">${i}</span><input class="input" value="${i===1?'45':'45'}"><input class="input" value="${i===1?'10':'—'}"><button class="check ${i===1?'done':''}" onclick="this.classList.toggle('done');this.textContent=this.classList.contains('done')?'✓':'○'">${i===1?'✓':'○'}</button></div>`);
function openExercise(){home.classList.add('hidden');exercise.classList.remove('hidden')}function goHome(){exercise.classList.add('hidden');home.classList.remove('hidden')}function openSheet(type){const title={tech:'Техника выполнения',history:'История упражнения',replace:'Замена упражнения'}[type];sheetTitle.textContent=title;sheetContent.innerHTML=type==='tech'?'<div style="aspect-ratio:16/9;background:linear-gradient(135deg,#273522,#101010);border-radius:16px;display:grid;place-items:center;font-size:42px;color:var(--lime)">▶</div><p style="color:#aaa;line-height:1.5">Видео техники будет открываться здесь без выхода из тренировки.</p>':type==='history'?'<div class="choice"><div><b>12 ноября 2026</b><small>45×10 · 45×10 · 45×9</small></div><span style="color:var(--lime)">Лёг</span></div><div class="choice"><div><b>6 ноября 2026</b><small>42,5×10 · 45×8 · 45×8</small></div><span style="color:var(--blue)">Тяж</span></div>':'<div class="eyebrow">Рекомендуемые</div><div class="choice"><div><b>Жим штанги лёжа</b><small>Грудь · похожее движение</small></div><span class="radio selected"></span></div><div class="choice"><div><b>Жим гантелей лёжа</b><small>Грудь · свободные веса</small></div><span class="radio"></span></div><div class="choice"><div><b>Жим в тренажёре</b><small>Грудь · стабильная траектория</small></div><span class="radio"></span></div>';sheet.classList.add('open')}function closeSheet(){sheet.classList.remove('open')}
</script>
</body>
</html>
