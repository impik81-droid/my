<style>
:root{color-scheme:dark;-webkit-tap-highlight-color:transparent;--bg:#000;--card:#121214;--card2:#1b1b1e;--text:#fff;--muted:#8e8e93;--line:#26262b;--accent:#c4f94d;--h:Unbounded,"Arial Black",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;border:0;color:var(--text);background:var(--card2);border-radius:12px;padding:10px 13px}
input,select{font:inherit;color:var(--text)}
input{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.hidden{display:none!important}
select option{background:#1b1b1e;color:#fff}
button,select{-webkit-tap-highlight-color:transparent;outline:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.sp,.round{flex:none;width:46px;height:46px;border-radius:50%}
.round{border:1px solid var(--line);background:none;padding:0;display:grid;place-items:center}
#program{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:none;border:0;text-align:center;text-align-last:center;text-transform:uppercase;font:800 16px var(--h);letter-spacing:.2px}
.auth{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.auth input{flex:1;min-width:130px}
.status{font-size:12px;color:var(--muted);margin:0 0 12px}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.sd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:11px 0;border-radius:20px;color:#d6d6da;font-size:14px}
.sd.today{background:var(--card2);color:#fff}
.sd i{width:10px;height:10px;border-radius:50%;background:#2b2b30}.sd i.on{background:var(--accent)}
.sd b{font:800 14px var(--h);color:#8a8a90}.sd.today b{color:#fff}
.ctl{display:flex;gap:10px;margin-bottom:26px}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
#dayseg{flex:1}
.seg button{flex:1;background:none;border-radius:999px;padding:11px 12px;font:800 16px var(--h);color:#cfcfd4}
.seg button.active{background:#000;color:#fff}
.wk button{font:600 16px -apple-system,system-ui,sans-serif;white-space:nowrap}
.wk button.active::after{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-left:8px}
.sec,.ss{font:800 17px var(--h);text-transform:uppercase}
.sec{margin:6px 0 16px}
.ss{display:flex;align-items:center;gap:12px;margin:24px 0 16px;padding-top:24px;border-top:1px solid var(--line)}
.sec+.ss{border-top:0;padding-top:0;margin-top:30px}
.ss svg{color:var(--accent);flex:none}
.row{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #2c2c31;background:#ececef;color:#111;display:grid;place-items:center}
.nm{font-size:19px;font-weight:600;line-height:1.2}
.sb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;color:var(--muted);font-size:16px}
.sb em{font-style:normal;color:#fff;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:15px}
.ex{margin-bottom:24px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:12px}
.sets span{font-size:12px;color:var(--muted);text-align:center}
.sets input{width:100%;padding:9px;text-align:center}
.check{width:38px;height:38px;padding:0;border-radius:50%}.check.on{background:var(--accent);color:#000}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;background:var(--accent);color:#000;border-radius:999px;padding:20px 28px;font:800 15px var(--h);text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.7)}
nav{display:flex;gap:8px;margin:28px 0 0}nav button{flex:1;background:var(--card);border:1px solid var(--line)}nav .active{background:var(--accent);color:#000;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.history-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{display:inline-block;margin-top:7px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}.pill.h{background:var(--accent);color:#000}.pill.l{background:var(--card2);color:#fff;border:1px solid var(--line)}
.hh{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.hh b{font:800 22px var(--h)}.hh button{padding:6px 12px;font-size:13px}
.hc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--dc,#f5a623);border-radius:22px;padding:16px 16px 6px;margin-bottom:14px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.hdate{font-size:19px;font-weight:700}.hsub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:4px;color:var(--muted);font-size:15px}.hsub .pill{margin:0}
.htrash{flex:none;width:44px;height:44px;border-radius:12px;background:#2a1418;color:#ffb6bd;padding:0;display:grid;place-items:center}
.hrow{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:16px;color:#cdd3dc}
.hn{flex:1;color:#fff;font-weight:500}.hs{color:#cdd3dc;text-align:right;max-width:55%;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px;margin-top:2px}
.exercise-row{padding:9px 0;border-top:1px solid var(--line)}.exercise-row:first-of-type{border-top:0}
.setline{color:#cdd3dc;font-size:13px;margin-top:3px}
button.danger{background:#2a1418;color:#ffb6bd}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}
.empty{text-align:center;color:var(--muted);padding:25px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;font-size:11px}
.cal .on{background:#243409;border-color:var(--accent)}
</style></head><body><div class="app">

async function finish(){
  let d = draft();
  let now = new Date();
  let todayKey = lk(now);
  let exercises = d.filter(e => !e.cardio).map(e => ({
    name: e.name,
    group: e.group,
    sets: e.sets.map(s => ({...s}))
  }));

  // Проверяем, есть ли уже запись за сегодня для текущего дня и программы
  let existingIndex = S.history.findIndex(x => {
    let xDate = new Date(x.date);
    return lk(xDate) === todayKey && x.program === S.program && x.day === S.day && x.week === S.week;
  });

  if (existingIndex !== -1) {
    // Обновляем существующую запись за этот день
    S.history[existingIndex].exercises = exercises;
    S.history[existingIndex].date = now.toISOString();
  } else {
    // Создаем новую запись, если за этот день еще не сохраняли
    let entry = {
      id: Date.now(),
      date: now.toISOString(),
      dateText: now.toLocaleDateString("ru-RU"),
      program: S.program,
      week: S.week,
      day: S.day,
      exercises: exercises
    };
    S.history.unshift(entry);
  }

  save();
  await push();
  S.page = "history";
  render();
  alert("Тренировка сохранена: " + (S.week === "heavy" ? "тяжёлый" : "лёгкий") + " день");
}

async function delH(i){S.history.splice(i,1);save();await push();renderH()}async function clearH(){if(confirm("Удалить всю историю?")){S.history=[];save();await push();renderH()}}function renderH(){document.getElementById("history").innerHTML=hist()}
function cal(){let m={};S.history.forEach(x=>m[lk(new Date(x.date))]=x.day);let d=new Date(),y=d.getFullYear(),mo=d.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),h='<div class="card"><b>Календарь</b></div><div class="cal">';for(let i=0;i<first;i++)h+='<div></div>';for(let i=1;i<=n;i++){let x=m[lk(new Date(y,mo,i))];h+=`<div class="${x?"on":""}"><b>${i}</b>${x?`<br>День ${L[x]||x}`:""}</div>`}return h+'</div>'}
