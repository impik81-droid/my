<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой дневник</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--card2:#1c2027;--text:#f4f5f7;--muted:#9aa1ac;--line:#292e37;--accent:#8cf06a;--danger:#ff6969}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:13px}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}button,select,input{font:inherit}
button{border:0;border-radius:12px;padding:11px 12px;background:var(--card2);color:var(--text);cursor:pointer}button.active,.accent{background:var(--accent);color:#081006}
button.danger{color:#ff8b8b}.grid{display:grid;gap:12px}.programs{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px}.exercise{background:#111419;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}
.ss{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:6px}.sets{display:grid;gap:6px}.set{display:grid;grid-template-columns:28px 1fr 1fr 42px;gap:6px;align-items:center}
input{width:100%;background:#0b0d10;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.check{width:40px;height:38px;padding:0}.done{border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:520px){.programs{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="app">
<div class="top"><div><h1>Мой дневник</h1><div class="sub" id="status">Облако не подключено</div></div><button id="authBtn">Войти</button></div>
<nav><button data-tab="home" class="active">Главная</button><button data-tab="workout">Тренировка</button><button data-tab="calendar">Календарь</button><button data-tab="history">История</button></nav>
<section id="home"></section><section id="workout" class="hidden"></section><section id="calendar" class="hidden"></section><section id="history" class="hidden"></section>
</main>

G:[["Кардио","Ходьба на дорожке","10 мин",null],["Суперсет 1","Разгибание рук на блоке","4×8–12",45],["Суперсет 1","Скамья Скотта","4×8–12",30],["Суперсет 2","Французский жим со штангой","4×8–12",15],["Суперсет 2","Сгибание рук с гантелями","4×8–12",12.5],["Суперсет 3","Махи с гантелями","4×8–12",12.5],["Суперсет 3","Обратная бабочка","4×8–12",35],["Суперсет 4","Жим гантелей сидя","4×8–12",12.5],["Суперсет 4","Пресс","4×8–12",0]]
},
"Фулбади":{
A:[["Кардио","Ходьба на дорожке","10 мин",null],["Суперсет 1","Жим лёжа со штангой","4×8–12",32.5],["Суперсет 1","Тяга ВБ широким хватом","4×8–12",55],["Суперсет 2","Махи с гантелями","4×8–12",12.5],["Суперсет 2","Сгибание ног лёжа","4×8–12",0],["Суперсет 3","Сгибание рук со штангой","4×8–12",30],["Суперсет 3","Разгибание рук на блоке","4×8–12",45],["Суперсет 3","Пресс","4×8–12",0],["Суперсет 4","Разгибание ног","4×8–12",90],["Суперсет 4","Обратная бабочка","4×8–12",35],["Суперсет 4","Икры в жимовой платформе","4×8–12",25]],

let state=JSON.parse(localStorage.getItem("wd")||'{"program":"Тяни–Толкай","day":"A","draft":[],"history":[]}');
let token=localStorage.getItem("wd_token")||"";
const $=s=>document.querySelector(s); const save=()=>{localStorage.setItem("wd",JSON.stringify(state)); if(token) fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({data:state})}).catch(()=>{})};
function sets(spec){let m=(spec||"").match(/(\d+)×/);return m?+m[1]:0}
function initDraft(){state.draft=P[state.program][state.day].map((x,i)=>({name:x[1],spec:x[2],base:x[3],sets:Array.from({length:sets(x[2])},()=>({w:x[3]??"",r:"",ok:false}))}));save()}
function renderHome(){let n=state.history.length;$("#home").innerHTML=`<div class="card"><h2>Твоя программа</h2><div class="programs grid">${Object.keys(P).map(p=>`<button class="${p==state.program?'active':''}" onclick="chooseProgram('${p}')">${p}</button>`).join("")}</div></div><div class="card"><h2>Статистика</h2><div class="sub">Тренировок сохранено: <b>${n}</b></div><div class="actions"><button class="accent" onclick="tab('workout')">Начать тренировку</button></div></div>`}
function chooseProgram(p){state.program=p;state.day=Object.keys(P[p])[0];initDraft();renderAll()}
function renderWorkout(){let days=Object.keys(P[state.program]);$("#workout").innerHTML=`<div class="card"><div class="day"><div><h2>${state.program}</h2><div class="muted">День ${state.day}</div></div><div>${days.map(d=>`<button class="${d==state.day?'active':''}" onclick="chooseDay('${d}')">${d}</button>`).join("")}</div></div></div>${state.draft.map((e,i)=>`<div class="exercise"><div class="ss">${P[state.program][state.day][i][0]}</div><h3>${e.name}</h3><div class="muted">${e.spec}${e.base!==null&&e.base!==undefined?' • базовый вес '+e.base+' кг':''}</div><div class="sets">${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input placeholder="кг" value="${s.w}" onchange="upd(${i},${j},'w',this.value)"><input placeholder="повторы" value="${s.r}" onchange="upd(${i},${j},'r',this.value)"><button class="check ${s.ok?'done':''}" onclick="toggle(${i},${j})">${s.ok?'✓':'○'}</button></div>`).join("")}</div></div>`).join("")}<div class="actions"><button class="accent" onclick="finish()">Сохранить тренировку</button><button onclick="initDraft();renderWorkout()">Сбросить</button></div>`}
function chooseDay(d){state.day=d;initDraft();renderAll()} function upd(i,j,k,v){state.draft[i].sets[j][k]=v;save()} function toggle(i,j){state.draft[i].sets[j].ok=!state.draft[i].sets[j].ok;save();renderWorkout()}
async function finish(){state.history.unshift({date:new Date().toISOString(),program:state.program,day:state.day,exercises:state.draft});save();await sync();initDraft();renderAll();alert("Тренировка сохранена")}
function renderHistory(){if(!state.history.length){$("#history").innerHTML='<div class="empty">История пока пустая</div>';return}$("#history").innerHTML=state.history.map((h,i)=>`<div class="card"><h3>${new Date(h.date).toLocaleDateString('ru-RU')} — ${h.program}, день ${h.day}</h3><div class="muted">${h.exercises.length} упражнений</div></div>`).join("")}
function renderCalendar(){let by={};state.history.forEach(h=>by[h.date.slice(0,10)]=1);let now=new Date(), y=now.getFullYear(),m=now.getMonth(),days=new Date(y,m+1,0).getDate();let cells=[];for(let d=1;d<=days;d++){let k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells.push(`<div class="card" style="padding:10px;text-align:center">${d}<div>${by[k]?'✓':'·'}</div></div>`)}$("#calendar").innerHTML=`<div class="card"><h2>${now.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><div class="grid" style="grid-template-columns:repeat(7,1fr)">${cells.join("")}</div></div>`}
function tab(t){document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));$("#"+t).classList.remove("hidden");document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab==t))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function sync(){if(!token)return;try{let r=await fetch("/api/data",{headers:{Authorization:"Bearer "+token}});if(r.ok){let x=await r.json();if(x.data){state=Object.assign(state,x.data);save()}}}catch(e){}}
async function auth(){let email=prompt("Email");if(!email)return;let password=prompt("Пароль (минимум 6 символов)");if(!password)return;let r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});let x=await r.json();if(!r.ok){alert(x.error||"Ошибка");return}token=x.token;localStorage.setItem("wd_token",token);state=Object.assign(state,x.data||{});save();$("#status").textContent="Синхронизация включена";renderAll()}
$("#authBtn").onclick=auth;
async function start(){if(!state.draft.length)initDraft();if(token)$("#status").textContent="Синхронизация включена";renderAll();if(token)await sync()}
function renderAll(){renderHome();renderWorkout();renderHistory();renderCalendar()}
start();
</script></body></html>
