<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Diary</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b0d10;
  --card:#15181d;
  --card2:#1b1f26;
  --border:#292e37;
  --text:#f5f7fa;
  --muted:#8d96a3;
  --accent:#4f8cff;
  --green:#27c77a;
  --red:#ff5964;
  --orange:#ffad42;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:700px;
  margin:auto;
  padding:14px 14px 100px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

h1{
  margin:0;
  font-size:25px;
}

h2{
  font-size:20px;
  margin:0 0 12px;
}

h3{
  margin:0;
  font-size:16px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  background:#0f1216;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:11px;
  padding:11px;
  outline:none;
}

select:focus,
input:focus{
  border-color:var(--accent);
}

.row{
  display:flex;
  gap:8px;
}

.row>*{
  flex:1;
}

.btn{
  background:var(--accent);
  color:white;
  border-radius:12px;
  padding:11px 14px;
  font-weight:600;
}

.btn.secondary{
  background:var(--card2);
  border:1px solid var(--border);
}

.btn.danger{
  background:#35171b;
  color:#ff7b84;
  border:1px solid #542127;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.tab{
  background:var(--card);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 5px;
  font-weight:700;
}

.tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

.week-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.week{
  padding:11px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--muted);
  font-weight:700;
}

.week.active{
  background:#263f6e;
  color:#fff;
  border-color:#477fdc;
}

.super{
  margin-top:13px;
  background:var(--card2);
  border-radius:14px;
  padding:11px;
  border:1px solid var(--border);
}

.super-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.badge{
  background:#252b34;
  color:#aeb7c4;
  border-radius:7px;
  padding:4px 7px;
  font-size:11px;
}

.exercise{
  background:#111419;
  border-radius:12px;
  padding:10px;
  margin-top:8px;
}

.exercise-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}

.exercise-name{
  font-weight:700;
  line-height:1.25;
}

.exercise-info{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.set{
  display:grid;
  grid-template-columns:32px 1fr 1fr 42px;
  gap:7px;
  align-items:center;
  margin-top:7px;
}

.set-number{
  color:var(--muted);
  text-align:center;
  font-size:12px;
}

.set input{
  padding:8px;
  font-size:14px;
}

.check{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#20252d;
  color:#707987;
  border:1px solid var(--border);
  font-size:18px;
}

.check.done{
  background:#153c2a;
  color:#35db8a;
  border-color:#267b50;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(11,13,16,.94);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--border);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  z-index:10;
}

.bottom-inner{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.nav{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--muted);
  border-radius:11px;
  padding:9px 5px;
  font-size:12px;
}

.nav.active{
  color:white;
  background:var(--accent);
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.history-item{
  padding:12px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card2);
  margin-bottom:8px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.day-dot{
  width:28px;
  height:28px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.day-A{background:#244c91}
.day-B{background:#276c45}
.day-V{background:#795021}
.day-G{background:#6a3479}

.history-date{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.cal-head{
  color:var(--muted);
  text-align:center;
  font-size:11px;
  padding:4px 0;
}

.cal-day{
  min-height:52px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:4px;
  background:var(--card);
  position:relative;
}

.cal-number{
  font-size:11px;
  color:var(--muted);
}

.cal-mark{
  position:absolute;
  bottom:4px;
  left:4px;
  right:4px;
  display:flex;
  gap:2px;
}

.cal-dot{
  flex:1;
  height:5px;
  border-radius:4px;
}

.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
}

.legend span{
  display:flex;
  align-items:center;
  gap:4px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.small{
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>Workout Diary</h1>
    <div class="sub" id="headerSub">Тренировка</div>
  </div>
</header>

<!-- WORKOUT -->
<section id="workoutPage">

  <div class="card">
    <label>Программа</label>
    <select id="programSelect"></select>
  </div>

  <div class="week-tabs">
    <button class="week" id="heavyBtn" onclick="setWeek('heavy')">
      🔴 Тяжёлая
    </button>
    <button class="week" id="lightBtn" onclick="setWeek('light')">
      🔵 Лёгкая
    </button>
  </div>

  <div class="tabs" id="dayTabs"></div>

  <div id="workout"></div>

  <button class="btn" style="width:100%;margin-top:8px" onclick="saveWorkout()">
    ✓ Сохранить тренировку
  </button>

</section>

<!-- HISTORY -->
<section id="historyPage" class="hidden">

  <div class="section-title">
    <h2>История</h2>
    <button class="btn danger" onclick="clearHistory()">Удалить всё</button>
  </div>

  <div id="history"></div>

</section>

<!-- CALENDAR -->
<section id="calendarPage" class="hidden">

  <div class="card">
    <div class="section-title">
      <button class="btn secondary" onclick="changeMonth(-1)">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="btn secondary" onclick="changeMonth(1)">›</button>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="legend">
      <span><i class="dot day-A"></i> А</span>
      <span><i class="dot day-B"></i> Б</span>
      <span><i class="dot day-V"></i> В</span>
      <span><i class="dot day-G"></i> Г</span>
    </div>
  </div>

</section>

</div>

<div class="bottom">
  <div class="bottom-inner">
    <button class="nav active" id="navWorkout" onclick="showPage('workout')">🏋️ Тренировка</button>
    <button class="nav" id="navHistory" onclick="showPage('history')">📋 История</button>
    <button class="nav" id="navCalendar" onclick="showPage('calendar')">📅 Календарь</button>
  </div>
</div>

/* =========================================================
   СОСТОЯНИЕ
========================================================= */

const STORAGE_KEY = "workout_diary_cloud_v5";

let state = loadState();

let calendarDate = new Date();

function defaultState(){
  return {
    program:"Тяни–Толкай",
    week:"heavy",
    day:"A",

    drafts:{},

    history:[],

    settings:{
      lastPage:"workout"
    }
  };
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();

    const saved=JSON.parse(raw);

    return {
      ...defaultState(),
      ...saved,
      drafts:saved.drafts||{},
      history:saved.history||[],
      settings:{
        ...defaultState().settings,
        ...(saved.settings||{})
      }
    };
  }catch(e){
    return defaultState();
  }
}

function persist(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
}


/* =========================================================
   КЛЮЧ ДЛЯ ОТДЕЛЬНОЙ НЕДЕЛИ
========================================================= */

function workoutKey(){
  return [
    state.program,
    state.week,
    state.day
  ].join("|");
}


/* =========================================================
   СОЗДАНИЕ ЧЕРНОВИКА
========================================================= */

function createDraft(){

  const day=programs[state.program].days[state.day];

  const result=[];

  day.groups.forEach((group,gi)=>{

    group.exercises.forEach((exercise,ei)=>{

      const name=exercise[0];
      const sets=exercise[1];
      const reps=exercise[2];
      const defaultWeight=exercise[3];

      const setData=[];

      for(let i=0;i<sets;i++){
        setData.push({
          weight:defaultWeight,
          reps:"",
          done:false
        });
      }

      result.push({
        id:`${gi}_${ei}`,
        name,
        reps,
        sets,
        data:setData
      });

    });

  });

  return result;
}

function getDraft(){

  const key=workoutKey();

  if(!state.drafts[key]){
    state.drafts[key]=createDraft();
    persist();
  }

  return state.drafts[key];
}


/* =========================================================
   РЕНДЕР
========================================================= */

function render(){

  document.getElementById("programSelect").innerHTML=
    Object.keys(programs)
      .map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`)
      .join("");

  document.getElementById("programSelect").value=state.program;

  renderWeeks();
  renderDays();
  renderWorkout();

  document.getElementById("headerSub").textContent=
    `${state.program} · ${state.week==="heavy"?"Тяжёлая":"Лёгкая"} неделя · День ${state.day}`;
}

function renderWeeks(){

  document.getElementById("heavyBtn")
    .classList.toggle("active",state.week==="heavy");

  document.getElementById("lightBtn")
    .classList.toggle("active",state.week==="light");
}

function renderDays(){

  const days=programs[state.program].days;

  document.getElementById("dayTabs").innerHTML=
    Object.keys(days).map(d=>`
      <button
        class="tab ${d===state.day?"active":""}"
        onclick="setDay('${d}')">
        День ${d}
      </button>
    `).join("");
}

function renderWorkout(){

  const program=programs[state.program];
  const day=program.days[state.day];
  const draft=getDraft();

  let html="";

  let exerciseIndex=0;

  day.groups.forEach((group,gi)=>{

    html+=`
      <div class="card">
        <div class="super-title">
          <h3>${escapeHtml(group.name)}</h3>
          <span class="badge">${group.exercises.length} упр.</span>
        </div>
    `;

    group.exercises.forEach((exercise,ei)=>{

      const ex=draft[exerciseIndex];

      html+=`
        <div class="exercise">

          <div class="exercise-head">
            <div>
              <div class="exercise-name">
                ${escapeHtml(exercise[0])}
              </div>

              <div class="exercise-info">
                ${exercise[1]} подхода · ${escapeHtml(exercise[2])}
              </div>
            </div>
          </div>
      `;

      if(exercise[1]===1 && exercise[2].includes("минут")){

        html+=`
          <div class="set">
            <div class="set-number">•</div>
            <input
              placeholder="Время"
              value="${escapeAttr(ex.data[0].reps)}"
              onchange="updateSet(${exerciseIndex},0,'reps',this.value)"
            >
            <input
              placeholder="Заметка"
              value="${escapeAttr(ex.data[0].weight)}"
              onchange="updateSet(${exerciseIndex},0,'weight',this.value)"
            >
            <button
              class="check ${ex.data[0].done?"done":""}"
              onclick="toggleSet(${exerciseIndex},0)"
            >
              ${ex.data[0].done?"✓":"○"}
            </button>
          </div>
        `;

      }else{

        for(let si=0;si<exercise[1];si++){

          const s=ex.data[si];

          html+=`
            <div class="set">

              <div class="set-number">${si+1}</div>

              <input
                inputmode="decimal"
                placeholder="Вес"
                value="${escapeAttr(s.weight)}"
                onchange="updateSet(${exerciseIndex},${si},'weight',this.value)"
              >

              <input
                inputmode="numeric"
                placeholder="Повт."
                value="${escapeAttr(s.reps)}"
                onchange="updateSet(${exerciseIndex},${si},'reps',this.value)"
              >

              <button
                class="check ${s.done?"done":""}"
                onclick="toggleSet(${exerciseIndex},${si})"
              >
                ${s.done?"✓":"○"}
              </button>

            </div>
          `;
        }
      }

      html+=`</div>`;

      exerciseIndex++;
    });

    html+=`</div>`;
  });

  document.getElementById("workout").innerHTML=html;
}


/* =========================================================
   ДЕЙСТВИЯ
========================================================= */

function setProgram(program){

  state.program=program;

  const days=Object.keys(programs[program].days);

  if(!days.includes(state.day)){
    state.day=days[0];
  }

  persist();
  render();
}

function setWeek(week){

  state.week=week;

  persist();
  render();
}

function setDay(day){

  state.day=day;

  persist();
  render();
}

function updateSet(exerciseIndex,setIndex,field,value){

  const draft=getDraft();

  draft[exerciseIndex].data[setIndex][field]=value;

  persist();
}

function toggleSet(exerciseIndex,setIndex){

  const draft=getDraft();

  draft[exerciseIndex].data[setIndex].done=
    !draft[exerciseIndex].data[setIndex].done;

  persist();

  renderWorkout();
}


/* =========================================================
   СОХРАНЕНИЕ ТРЕНИРОВКИ
========================================================= */

function saveWorkout(){

  const draft=getDraft();

  const completed=draft.reduce(
    (sum,ex)=>
      sum+ex.data.filter(s=>s.done).length,
    0
  );

  if(completed===0){

    alert("Отметь хотя бы один выполненный подход.");

    return;
  }

  const record={
    id:Date.now(),
    date:new Date().toISOString(),
    program:state.program,
    week:state.week,
    day:state.day,
    exercises:JSON.parse(JSON.stringify(draft))
  };

  state.history.unshift(record);

  persist();

  alert("Тренировка сохранена ✓");

  renderHistory();
  renderCalendar();
}


/* =========================================================
   ИСТОРИЯ
========================================================= */

function renderHistory(){

  const box=document.getElementById("history");

  if(!state.history.length){

    box.innerHTML=`
      <div class="empty">
        История тренировок пока пустая.
      </div>
    `;

    return;
  }

  box.innerHTML=state.history.map(item=>{

    const date=new Date(item.date);

    return `
      <div class="history-item">

        <div class="history-top">

          <div style="display:flex;gap:10px;align-items:center">

            <div class="day-dot day-${item.day}">
              ${item.day}
            </div>

            <div>
              <strong>${escapeHtml(item.program)}</strong>

              <div class="history-date">
                ${date.toLocaleDateString("ru-RU")}
                ·
                ${item.week==="heavy"?"Тяжёлая":"Лёгкая"} неделя
              </div>
            </div>

          </div>

          <button
            class="btn danger"
            onclick="deleteHistory(${item.id})">
            Удалить
          </button>

        </div>

      </div>
    `;

  }).join("");
}

function deleteHistory(id){

  if(!confirm("Удалить эту тренировку из истории?")) return;

  state.history=
    state.history.filter(x=>x.id!==id);

  persist();

  renderHistory();
  renderCalendar();
}

function clearHistory(){

  if(!state.history.length) return;

  if(!confirm("Удалить всю историю тренировок?")) return;

  state.history=[];

  persist();

  renderHistory();
  renderCalendar();
}


/* =========================================================
   КАЛЕНДАРЬ
========================================================= */

function changeMonth(delta){

  calendarDate.setMonth(
    calendarDate.getMonth()+delta
  );

  renderCalendar();
}

function renderCalendar(){

  const year=calendarDate.getFullYear();
  const month=calendarDate.getMonth();

  document.getElementById("monthTitle").textContent=
    new Date(year,month,1)
      .toLocaleDateString("ru-RU",{
        month:"long",
        year:"numeric"
      });

  const firstDay=
    new Date(year,month,1).getDay();

  const start=(firstDay+6)%7;

  const daysInMonth=
    new Date(year,month+1,0).getDate();

  let html="";

  ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].forEach(d=>{
    html+=`<div class="cal-head">${d}</div>`;
  });

  for(let i=0;i<start;i++){
    html+=`<div></div>`;
  }

  for(let day=1;day<=daysInMonth;day++){

    const dateKey=
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const records=state.history.filter(item=>{

      const d=new Date(item.date);

      const key=
        `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

      return key===dateKey;

    });

    const uniqueDays=[
      ...new Set(records.map(r=>r.day))
    ];

    html+=`
      <div class="cal-day">

        <div class="cal-number">${day}</div>

        ${
          uniqueDays.length
          ?
          `<div class="cal-mark">
            ${uniqueDays.map(d=>`
              <div class="cal-dot day-${d}"></div>
            `).join("")}
          </div>`
          :""
        }

      </div>
    `;
  }

  document.getElementById("calendar").innerHTML=html;
}


/* =========================================================
   СТРАНИЦЫ
========================================================= */

function showPage(page){

  state.settings.lastPage=page;

  persist();

  document.getElementById("workoutPage")
    .classList.toggle("hidden",page!=="workout");

  document.getElementById("historyPage")
    .classList.toggle("hidden",page!=="history");

  document.getElementById("calendarPage")
    .classList.toggle("hidden",page!=="calendar");

  document.getElementById("navWorkout")
    .classList.toggle("active",page==="workout");

  document.getElementById("navHistory")
    .classList.toggle("active",page==="history");

  document.getElementById("navCalendar")
    .classList.toggle("active",page==="calendar");

  if(page==="history") renderHistory();
  if(page==="calendar") renderCalendar();
}


/* =========================================================
   ВСПОМОГАТЕЛЬНОЕ
========================================================= */

function escapeHtml(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}


/* =========================================================
   СТАРТ
========================================================= */

document
  .getElementById("programSelect")
  .addEventListener("change",e=>{
    setProgram(e.target.value);
  });

render();

showPage(state.settings.lastPage || "workout");

</script>
