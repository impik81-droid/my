<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;border:0;color:var(--text);background:var(--card2);border-radius:12px;padding:10px 13px}
input,select{font:inherit;color:var(--text)}
input{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.hidden{display:none!important}
select option{background:#1b1b1e;color:#fff}
button,select{-webkit-tap-highlight-color:transparent;outline:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.sp,.round{flex:none;width:46px;height:46px;border-radius:50%}
.round{border:1px solid var(--line);background:none;padding:0;display:grid;place-items:center}
#program{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:none;border:0;text-align:center;text-align-last:center;text-transform:uppercase;font:800 16px var(--h);letter-spacing:.2px}
.auth{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.auth-row{display:flex;gap:7px;flex-wrap:wrap}.auth-row input{flex:1;min-width:130px}
.user-box{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.user-box span{color:var(--accent);font-weight:600}
.status{font-size:12px;color:var(--muted);margin:0 0 12px}

/* Навигация сверху */
nav{display:flex;gap:8px;margin-bottom:16px}nav button{flex:1;background:var(--card);border:1px solid var(--line)}nav .active{background:var(--accent);color:#000;border-color:var(--accent)}

.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.sd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:11px 0;border-radius:20px;color:#d6d6da;font-size:14px}
.sd.today{background:var(--card2);color:#fff}
.sd i{width:10px;height:10px;border-radius:50%;background:#2b2b30}.sd i.on{background:var(--accent)}
.sd b{font:800 14px var(--h);color:#8a8a90}.sd.today b{color:#fff}
.ctl{display:flex;gap:10px;margin-bottom:26px}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
#dayseg{flex:1}
.seg button{flex:1;background:none;border-radius:999px;padding:11px 12px;font:800 16px var(--h);color:#cfcfd4}
.seg button.active{background:#000;color:#fff}
.wk button{font:600 16px -apple-system,system-ui,sans-serif;white-space:nowrap}
.wk button.active::after{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-left:8px}
.sec,.ss{font:800 17px var(--h);text-transform:uppercase}
.sec{margin:6px 0 16px}
.ss{display:flex;align-items:center;gap:12px;margin:24px 0 16px;padding-top:24px;border-top:1px solid var(--line)}
.sec+.ss{border-top:0;padding-top:0;margin-top:30px}
.ss svg{color:var(--accent);flex:none}
.row{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #2c2c31;background:#ececef;color:#111;display:grid;place-items:center}
.nm{font-size:19px;font-weight:600;line-height:1.2}
.sb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;color:var(--muted);font-size:16px}
.sb em{font-style:normal;color:#fff;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:15px}
.ex{margin-bottom:24px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:12px}
.sets span{font-size:12px;color:var(--muted);text-align:center}
.sets input{width:100%;padding:9px;text-align:center}
.check{width:38px;height:38px;padding:0;border-radius:50%}.check.on{background:var(--accent);color:#000}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;background:var(--accent);color:#000;border-radius:999px;padding:20px 28px;font:800 15px var(--h);text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.hh{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.hh b{font:800 20px var(--h)}.hh button{padding:5px 10px;font-size:12px}

/* Ультракомпактный стиль истории */
.hc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--dc,#f5a623);border-radius:12px;padding:8px 10px 2px;margin-bottom:8px}
.hc-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:3px}
.hdate{font-size:14px;font-weight:700;line-height:1.1}
.hsub{color:var(--muted);font-size:11px;margin-top:1px}
.htrash{flex:none;width:26px;height:26px;border-radius:6px;background:#2a1418;color:#ffb6bd;padding:0;display:grid;place-items:center}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12px;color:#cdd3dc}
.hn{flex:1;color:#fff;font-weight:500;line-height:1.2}
.hs{color:#cdd3dc;text-align:right;max-width:60%;font-size:12px;font-variant-numeric:tabular-nums}

.h-actions{display:flex;gap:4px}
.hbtn{background:var(--card2);color:var(--muted);padding:4px 8px;font-size:11px;border-radius:6px;border:1px solid var(--line)}
.chart-box{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:12px}
.chart-title{font-weight:700;color:var(--accent);margin-bottom:6px;display:flex;justify-content:space-between}
.chart-svg{width:100%;height:80px;overflow:visible}
button.danger{background:#2a1418;color:#ffb6bd}
.empty{text-align:center;color:var(--muted);padding:25px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;font-size:11px}
.cal div.on{cursor:pointer}
.cal .on-heavy{background:#0f2a4d;border-color:#4da3ff}
.cal .on-light{background:#33230a;border-color:#f5a623}
.wt{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px}
.wt.heavy{background:#0f2a4d;color:#4da3ff}
.wt.light{background:#33230a;color:#f5a623}
#light.active::after{background:#f5a623}
#heavy.active::after{background:#4da3ff}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:7;background:#2b2b30;border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:92vw}
.toast button{background:none;color:var(--accent);padding:0;font-weight:700}
.hint{color:var(--accent);font-size:13px;margin-top:6px}
.ctr{display:flex;gap:6px;margin-top:10px}.ctr button{flex:1;font-size:12px;padding:8px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.note{width:100%;margin-top:8px;font-size:13px}
.pr{font-size:10px;font-weight:800;color:#000;background:var(--accent);border-radius:6px;padding:1px 6px;white-space:nowrap}
.big{font:800 22px var(--h);display:block}
nav button{padding:10px 4px;font-size:14px}
.bf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bf label,.er label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.bf input,.er input{width:100%}.er{display:flex;gap:6px;align-items:flex-end;margin-top:8px}.er label{flex:1;font-size:11px}.er input{padding:8px;text-align:center}.er button{padding:10px}
.edbtn{width:100%;margin-top:8px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.sheetbg{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sh{width:100%;max-width:760px;margin:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.alt{width:100%;text-align:left;margin-top:6px;background:var(--card2);border:1px solid var(--line)}

function up(i,j,k,v){let E=draft()[i],sets=E.sets;E.m=1;sets[j][k]=v;if(j===0){for(let x=1;x<sets.length;x++)sets[x][k]=v}else if(j+1<sets.length&&(sets[j+1][k]===""||sets[j+1][k]==0))sets[j+1][k]=v;touch();renderW()}function tg(i,j){let s=draft()[i].sets[j];s.done=!s.done;touch();renderW()}function day(x){S.day=x;save();render()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r;try{r=await fetch(url,opt)}catch(e){throw new Error("нет связи с сервером (открой сайт по адресу pages.dev)")}if(r.status===401&&token){token="";localStorage.removeItem("wd_token")}if(!r.ok){let tx="";try{tx=(await r.text()).slice(0,200)}catch(e){}let m=tx;try{m=JSON.parse(tx).error||tx}catch(e){}throw new Error("["+r.status+"] "+(m||r.statusText||"пустой ответ"))}return r.json()}
async function sync(){if(!token)return;try{let x=await api("/api/data");if(x.data){let c=JSON.parse(x.data);S.del=S.del||{};let cdl=c.del||{};for(let k in cdl)S.del[k]=Math.max(S.del[k]||0,cdl[k]);let lim=Date.now()-180*864e5;for(let k in S.del)if(S.del[k]<lim)delete S.del[k];S.history=merge(S.history,c.history||[]);S.body=mergeB(S.body||[],c.body||[]);S.progs={...(c.progs||{}),...(S.progs||{})};Object.assign(P,S.progs);fillProg();fixDrafts();S.dts=S.dts||{};Object.keys(S.drafts).forEach(k=>{if(!S.dts[k]&&S.drafts[k].some(e=>e.sets.some(x=>x.done||x.reps!=="")))S.dts[k]=Date.now()});let cd=c.drafts||{},ct=c.dts||{};for(let k of new Set([...Object.keys(cd),...Object.keys(ct)]))if((ct[k]||0)>(S.dts[k]||0)){if(cd[k])S.drafts[k]=cd[k];else delete S.drafts[k];S.dts[k]=ct[k]}
fixDrafts();save();render();await push();let l=S.history[0];setStatus("Синхронизировано ☁️ Тренировок: "+S.history.length+" (в облаке было "+(c.history||[]).length+")"+(l?". Последняя: "+new Date(l.date).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})+", день "+(L[l.day]||l.day):"")+". Нажми, чтобы обновить.")}}catch(e){setStatus("Не удалось синхронизировать: "+e.message)}}
async function push(){if(!token)return;try{let x=await api("/api/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:JSON.stringify({program:S.program,week:S.week,day:S.day,history:S.history,body:S.body,progs:S.progs,drafts:S.drafts,dts:S.dts,del:S.del})})});setStatus("Сохранено в облако ☁")}catch(e){setStatus("Ошибка облачного сохранения: "+e.message)}}
async function register(){let em=document.getElementById("email").value, pw=document.getElementById("password").value;try{let r=await api("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"register",email:em,password:pw})});token=r.token;userEmail=em;localStorage.setItem("wd_token",token);localStorage.setItem("wd_email",userEmail);showAuth=false;setStatus("Аккаунт создан и выполнен вход ☁️");renderAuth();await push()}catch(e){setStatus("Ошибка регистрации: "+e.message)}}
async function login(){let em=document.getElementById("email").value, pw=document.getElementById("password").value;try{let r=await api("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",email:em,password:pw})});token=r.token;userEmail=em;localStorage.setItem("wd_token",token);localStorage.setItem("wd_email",userEmail);showAuth=false;setStatus("Вход выполнен ☁️");renderAuth();await sync()}catch(e){setStatus("Ошибка входа: "+e.message)}}

async function finish(){
  let d = draft();
  let now = new Date();
  let todayKey = lk(now);
  let exercises = d.filter(e => !e.cardio).map(e => ({
    name: e.name,
    group: e.group, note: e.note||"",
    sets: e.sets.map(s => ({...s}))
  }));

  S.history = S.history.filter(x => {
    let xDate = new Date(x.date);
    let isToday = lk(xDate) === todayKey;
    let isSameWorkout = x.program === S.program && x.day === S.day && x.week === S.week;
    let keep=!(isToday&&isSameWorkout);if(!keep)(S.del=S.del||{})[hk(x)]=Date.now();return keep;
  });

  let entry = {
    id: Date.now(),
    date: now.toISOString(),
    dateText: now.toLocaleDateString("ru-RU"),
    program: S.program,
    week: S.week,
    day: S.day,
    exercises: exercises
  };
  
  S.history.unshift(entry);delete S.drafts[key()];(S.dts=S.dts||{})[key()]=Date.now();

  save();
  await push();
  S.page = "history";
  render();
  toast("Тренировка сохранена");
}

function hist(){
  let f=S.histDate||null;
  let h='<div class="hh"><b>История</b><span style="display:flex;gap:6px">';
  if(f){let fd=new Date(f);h+=`<button onclick="clearDate()">✕ ${fd.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</button>`}
  h+='<button onclick="exp()" aria-label="Экспорт">⬇</button><button onclick="document.getElementById(\'imp\').click()" aria-label="Импорт">⬆</button><button class="danger" onclick="clearH()">Очистить</button></span></div><input id="imp" type="file" accept=".json" class="hidden" onchange="imp(this)">';
  const DC={A:"#f5a623",B:"#4f8cff",V:"#ff5d9e",G:"#8b7bff"},TR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';
  let any=false;
  S.history.forEach((x,i)=>{
    let kd=lk(new Date(x.date));
    if(f&&kd!==f)return;
    any=true;
    let dt=new Date(x.date),ds=isNaN(dt)?esc(x.dateText):dt.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
    let wtag=x.week==="light"?'<span class="wt light">ЛЁГ</span>':'<span class="wt heavy">ТЯЖ</span>';
    h+=`<div class="hc" style="--dc:${DC[x.day]||"#f5a623"}">
      <div class="hc-top">
        <div>
          <div class="hdate">${ds}</div>
          <div class="hsub">День ${L[x.day]||x.day} (${esc(x.program)}) • ${wtag}</div>
        </div>
        <div class="h-actions">
          <button class="hbtn" onclick="toggleChart('${esc(x.exercises[0]?.name||"")}', ${i})" title="График">📈</button>
          <button class="htrash" aria-label="Удалить" onclick="if(confirm('Удалить тренировку?'))delH(${i})">${TR}</button>
        </div>
      </div><div id="chart-container-${i}"></div>`;
    x.exercises.forEach(e=>{
      let s=e.sets.filter(s=>s.done||s.reps!=="").map(s=>s.weight?`${s.weight}×${s.reps||"—"}`:`×${s.reps||"—"}`).join(", ");
      h+=`<div class="hrow"><span class="hn" onclick="toggleChart('${esc(e.name)}', ${i})" style="cursor:pointer" title="Показать график">${esc(e.name)}${pr(i,e)?` <span class="pr">🏆 1ПМ≈${Math.max(...e.sets.map(e1))}</span>`:""}${e.note?`<div class="hsub">${esc(e.note)}</div>`:""}</span><span class="hs">${s||"—"}</span></div>`;
    });
    h+='</div>';
  });
  if(!any)h+=f?'<div class="empty">Нет тренировок за эту дату</div>':'<div class="empty">История пустая</div>';
  return h;
}
function openDate(k){S.histDate=k;S.page="history";save();render()}
function clearDate(){S.histDate=null;save();render()}

function toggleChart(exName,hi){
  let c=document.getElementById(`chart-container-${hi}`);
  if(c.innerHTML.trim()!==""){c.innerHTML="";return}
  let points=[];
  [...S.history].reverse().forEach(h=>{
    let ex=h.exercises.find(e=>e.name===exName);
    if(ex){
      let maxW=0;
      ex.sets.forEach(s=>{let w=parseFloat(s.weight)||0;if(w>maxW)maxW=w});
      if(maxW>0)points.push({date:new Date(h.date).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}),weight:maxW});
    }
  });
  if(points.length<1){c.innerHTML=`<div class="chart-box"><div class="chart-title"><span>${esc(exName)}</span></div><div style="color:var(--muted);text-align:center;padding:10px">Мало данных для графика</div></div>`;return}
  let maxW=Math.max(...points.map(p=>p.weight)),minW=Math.min(...points.map(p=>p.weight)),span=maxW-minW||1;
  let width=300,height=70,pts="",circ="";
  points.forEach((p,idx)=>{
    let cx=points.length===1?width/2:(idx/(points.length-1))*(width-40)+20;
    let cy=height-15-((p.weight-minW)/span)*(height-30);
    pts+=`${cx},${cy} `;
    circ+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--accent)"/><text x="${cx}" y="${cy-8}" font-size="10" fill="#fff" text-anchor="middle">${p.weight}</text><text x="${cx}" y="${height-2}" font-size="9" fill="var(--muted)" text-anchor="middle">${p.date}</text>`;
  });
  c.innerHTML=`<div class="chart-box"><div class="chart-title"><span>📊 Прогресс: ${esc(exName)}</span><span style="cursor:pointer;color:var(--muted)" onclick="document.getElementById('chart-container-${hi}').innerHTML=''">✕ закрыть</span></div><svg class="chart-svg" viewBox="0 0 ${width} ${height}"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.trim()}"/>${circ}</svg></div>`;
}

async function delH(i){let x=S.history.splice(i,1)[0];(S.del=S.del||{})[hk(x)]=Date.now();save();await push();renderH();toast("Тренировка удалена",async()=>{x.id=Date.now();S.history=merge(S.history,[x]);save();await push();renderH()})}async function clearH(){if(confirm("Удалить всю историю?")){S.del=S.del||{};S.history.forEach(x=>S.del[hk(x)]=Date.now());S.history=[];save();await push();renderH()}}function renderH(){document.getElementById("history").innerHTML=hist()}
function cal(){let m={};S.history.forEach(x=>{let k=lk(new Date(x.date));if(!m[k])m[k]={day:x.day,week:x.week}});let n0=new Date(),d=new Date(n0.getFullYear(),n0.getMonth()+(S.co||0),1),y=d.getFullYear(),mo=d.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate(),h=stats()+'<div class="card"><div class="hh" style="margin:0"><button onclick="cmo(-1)">‹</button><b style="font-size:15px">'+d.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})+'</b><button onclick="cmo(1)">›</button></div><div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#4da3ff;margin-right:5px"></i>Тяжёлая</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#f5a623;margin-right:5px"></i>Лёгкая</span></div></div><div class="cal">';for(let i=0;i<first;i++)h+='<div></div>';for(let i=1;i<=n;i++){let k=lk(new Date(y,mo,i)),x=m[k];if(x)h+=`<div class="${x.week==="light"?"on-light":"on-heavy"}" onclick="openDate('${k}')"><b>${i}</b><br>День ${L[x.day]||x.day} · ${x.week==="light"?"лёг":"тяж"}</div>`;else h+=`<div><b>${i}</b></div>`}return h+'</div>'}
