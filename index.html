.hidden{display:none!important}
select option{background:#1b1b1e;color:#fff}
button,select{-webkit-tap-highlight-color:transparent;outline:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sp,.round{flex:none;width:46px;height:46px;border-radius:50%}
.round{border:1px solid var(--line);background:none;padding:0;display:grid;place-items:center}
#program{flex:1;min-width:0;appearance:none;-webkit-appearance:none;background:none;border:0;text-align:center;text-align-last:center;text-transform:uppercase;font:800 16px var(--h);letter-spacing:.2px}
.auth{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.auth-row{display:flex;gap:7px;flex-wrap:wrap}.auth-row input{flex:1;min-width:130px}
.user-box{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.user-box span{color:var(--accent);font-weight:600}
.status{font-size:12px;color:var(--muted);margin:0 0 12px}

nav{display:flex;gap:8px;margin-bottom:16px}nav button{flex:1;background:var(--card);border:1px solid var(--line)}nav .active{background:var(--accent);color:#000;border-color:var(--accent)}

.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.sd{display:flex;flex-direction:column;align-items:center;gap:8px;padding:11px 0;border-radius:20px;color:#d6d6da;font-size:14px}
.sd.today{background:var(--card2);color:#fff}
.sd i{width:10px;height:10px;border-radius:50%;background:#2b2b30}.sd i.on{background:var(--accent)}
.sd b{font:800 14px var(--h);color:#8a8a90}.sd.today b{color:#fff}
.ctl{display:flex;gap:10px;margin-bottom:26px}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px}
#dayseg{flex:1}
.seg button{flex:1;background:none;border-radius:999px;padding:11px 12px;font:800 16px var(--h);color:#cfcfd4}
.seg button.active{background:#000;color:#fff}
.wk button{font:600 16px -apple-system,system-ui,sans-serif;white-space:nowrap}
.wk button.active::after{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-left:8px}
.sec,.ss{font:800 17px var(--h);text-transform:uppercase}
.sec{margin:6px 0 16px}
.ss{display:flex;align-items:center;gap:12px;margin:24px 0 16px;padding-top:24px;border-top:1px solid var(--line)}

.ss svg{color:var(--accent);flex:none}
.row{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #2c2c31;background:#ececef;color:#111;display:grid;place-items:center}
.nm{font-size:19px;font-weight:600;line-height:1.2}
.sb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px;color:var(--muted);font-size:16px}
.sb em{font-style:normal;color:#fff;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:15px}
.ex{margin-bottom:24px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:12px}
.sets span{font-size:12px;color:var(--muted);text-align:center}

.hh{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.hh b{font:800 20px var(--h)}.hh button{padding:5px 10px;font-size:12px}

.hsub{color:var(--muted);font-size:11px;margin-top:1px}

.hn{flex:1;color:#fff;font-weight:500;line-height:1.2}
.hs{color:#cdd3dc;text-align:right;max-width:60%;font-size:12px;font-variant-numeric:tabular-nums}

button.danger{background:#2a1418;color:#ffb6bd}
.empty{text-align:center;color:var(--muted);padding:25px}

.cal div.on{cursor:pointer}

.cal .on-light{background:#33230a;border-color:#f5a623}

.pr{font-size:10px;font-weight:800;color:#000;background:var(--accent);border-radius:6px;padding:1px 6px;white-space:nowrap}

const ICO='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V5m0 0L4.5 8.5M8 5l3.5 3.5M16 4v15m0 0-3.5-3.5M16 19l3.5-3.5"/></svg>';
let rt=null,rleft=0,tt,rend=0,AC=null;
function startRest(n=90){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}rend=Date.now()+n*1000;rleft=n;clearInterval(rt);rt=setInterval(tick,500);drawT()}
function tick(){rleft=Math.ceil((rend-Date.now())/1000);if(rleft<=0){stopRest();navigator.vibrate&&navigator.vibrate([300,100,300]);beep();toast("Отдых закончен")}else drawT()}
function beep(){try{let o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(AC.currentTime+.5)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(rt)tick()});
function restBar(){let r=S.rest||90;return`<div class="rb"><span>Отдых</span>${[60,90,120,180].map(x=>`<button class="${x==r?"active":""}" onclick="S.rest=${x};save();renderW()">${x>=120?x/60+" мин":x+" с"}</button>`).join("")}<button class="${S.noauto?"":"active"}" onclick="S.noauto=!S.noauto;save();renderW()">Авто</button><button onclick="startRest(S.rest||90)" aria-label="Запустить таймер">▶</button></div>`}
function stopRest(){clearInterval(rt);rt=null;document.getElementById("timer").classList.add("hidden")}
function addRest(d){rend+=d*1000;tick()}
function drawT(){let t=document.getElementById("timer");t.classList.remove("hidden");t.innerHTML=`<b>${Math.floor(rleft/60)}:${String(rleft%60).padStart(2,"0")}</b><button onclick="addRest(-15)">−15</button><button onclick="addRest(15)">+15</button><button onclick="stopRest()">✕</button>`}
function toast(m,undo){let e=document.getElementById("toast");e.innerHTML=esc(m)+(undo?'<button id="tu">Отменить</button>':"");e.classList.remove("hidden");if(undo)document.getElementById("tu").onclick=()=>{undo();e.classList.add("hidden")};clearTimeout(tt);tt=setTimeout(()=>e.classList.add("hidden"),4500)}
function lastEx(n){for(let h of S.history){let e=h.exercises.find(e=>e.name===n);if(e)return e}return null}
function hint(n){let e=lastEx(n);if(!e)return"";let a=e.sets.filter(s=>s.reps!=="");if(!a.length)return"";let w=Math.max(...a.map(s=>+s.weight||0)),up=w>0&&a.every(s=>+s.reps>=12&&(+s.weight||0)===w);return`<div class="hint">Прошлый раз: ${esc(a.map(s=>(s.weight||0)+"×"+s.reps).join(" · "))}${up?` <b>→ попробуй ${w+2.5} кг</b>`:""}</div>`}
const mw=e=>Math.max(0,...e.sets.map(s=>+s.weight||0)),e1=s=>{let r=+s.reps||0;return r?Math.round((+s.weight||0)*(1+r/30)):0};
function pr(i,e){let w=mw(e);if(!w)return false;let seen=false;for(let k=i+1;k<S.history.length;k++){let o=S.history[k].exercises.find(o=>o.name===e.name);if(o){seen=true;if(mw(o)>=w)return false}}return seen}
const wk=d=>lk(new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)));
function merge(a,b){let m=new Map();[...b,...a].forEach(x=>m.set(x.id||x.date,x));return[...m.values()].sort((x,y)=>new Date(y.date)-new Date(x.date))}
function exp(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({history:S.history,body:S.body})],{type:"application/json"}));a.download="workout-"+lk(new Date())+".json";a.click()}
function imp(el){let f=el.files[0];if(!f)return;f.text().then(t=>{let j=JSON.parse(t);S.history=merge(S.history,j.history||[]);S.body=mergeB(S.body||[],j.body||[]);save();push();render();toast("История импортирована")}).catch(()=>toast("Не удалось прочитать файл"))}
function addSet(i){let s=draft()[i].sets,l=s[s.length-1]||{weight:0,reps:""};s.push({weight:l.weight,reps:l.reps,done:false});touch();renderW()}
function delSet(i){let s=draft()[i].sets;if(s.length>1){s.pop();touch();renderW()}}
function ren(i){pick(i,"w")}
function note(i,v){draft()[i].note=v;touch()}
function cmo(d){S.co=Math.min(0,(S.co||0)+d);save();render()}
function stats(){let H=S.history,t=new Date(),mk=lk(t).slice(0,7),mc=H.filter(x=>lk(new Date(x.date)).startsWith(mk)).length,c={};H.forEach(x=>{let k=wk(new Date(x.date));c[k]=1});let ks=[];for(let i=7;i>=0;i--)ks.push(wk(new Date(t.getFullYear(),t.getMonth(),t.getDate()-7*i)));let st=0;for(let i=ks.length-1;i>=0;i--){if(c[ks[i]])st++;else if(i<ks.length-1)break}return`<div class="card"><div style="display:flex;justify-content:space-around;text-align:center"><div><b class="big">${mc}</b><div class="hsub">за месяц</div></div><div><b class="big">${st}</b><div class="hsub">недель подряд</div></div></div></div>`}
let ED=null,PK=null,pt;
function pushSoon(){clearTimeout(pt);pt=setTimeout(push,1500)}
function touch(){(S.dts=S.dts||{})[key()]=Date.now();save();pushSoon()}
const ALT={
cardio:["Кардио: Ходьба на дорожке","Кардио: Эллипс","Кардио: Велотренажёр","Кардио: Гребной тренажёр","Кардио: Степпер"],
chest:["Жим лёжа со штангой","Жим лёжа в Смите","Жим в Смите 30°","Жим гантелей лёжа","Жим гантелей на наклонной скамье","Жим в тренажёре сидя","Отжимания на брусьях"],
fly:["Бабочка","Разводка гантелей лёжа","Сведение рук в кроссовере","Сведение на блоках снизу вверх"],
sh:["Жим гантелей сидя","Жим в Смите сидя","Жим в тренажёре на плечи","Жим Арнольда"],
lat:["Махи с гантелями","Махи на нижнем блоке","Махи в тренажёре","Махи в наклоне на скамье"],
rear:["Обратная бабочка","Отведение в Пек-Деке","Разводка гантелей в наклоне","Тяга канатной рукояти к лицу"],
tri:["Разгибание рук на блоке","Разгибание рук с рукояткой","Французский жим","Разгибание рук из-за головы","Жим узким хватом в Смите","Отжимания на брусьях (трицепс)"],
bi:["Сгибание рук со штангой","Сгибание гантелей","Скамья Скотта","Молотки с гантелями","Сгибание на нижнем блоке","Сгибание рук с гантелями на наклонной скамье под 60°"],
row:["Горизонтальная тяга Hammer","Тяга горизонтального блока","Тяга гантели одной рукой","Тяга гантели широким хватом","Тяга Т-грифа","Тяга штанги в наклоне"],
pull:["Тяга верхнего блока широким хватом","Тяга верхнего блока узким хватом","Тяга верхнего блока обратным хватом","Подтягивания","Подтягивания в гравитроне"],
shr:["Шраги с гантелями","Шраги в Смите","Шраги в тренажёре","Шраги со штангой"],
quad:["Присед в Гакке","Хак-присед","Жим ногами","Присед в Смите","Выпады с гантелями","Болгарские сплит-приседы"],
lext:["Разгибание ног","Жим ногами узкой постановкой","Присед в Гакке","Выпады в Смите"],
ham:["Сгибание ног лёжа","Сгибание ног сидя","Румынская тяга с гантелями","Румынская тяга в Смите","Гиперэкстензия"],
glu:["Ягодичный мост со штангой","Ягодичный мост в Смите","Присед в гакк на ягодицу","Румынская тяга с гантелями","Отведение ноги в кроссовере","Выпады назад"],
calf:["Икры в тренажёре","Икры в жиме ногами","Икры стоя в Смите","Икры сидя"],
abs:["Пресс","Скручивания на блоке","Подъём ног в висе","Скручивания на римском стуле","Планка"]};
const RULES=[[/кардио/,"cardio"],[/пресс/,"abs"],[/икр/,"calf"],[/шраг/,"shr"],[/ягодичн/,"glu"],[/разгибание ног/,"lext"],[/сгибание ног/,"ham"],[/гакк|хак|жим ногами|присед/,"quad"],[/обратная бабочка|пек|отведение/,"rear"],[/бабочка|разводк/,"fly"],[/жим гантелей сидя/,"sh"],[/французск|из-за головы|разгибание рук/,"tri"],[/жим/,"chest"],[/мах/,"lat"],[/сгибание рук|сгибание гантелей|скотт/,"bi"],[/подтяг|верхнего блока/,"pull"],[/тяга/,"row"]];
const cat=n=>{n=n.toLowerCase();for(let [x,c] of RULES)if(x.test(n))return c;return null};
function pick(i,m){let L0=m=="e"?ED:draft(),cur=L0[i].name,used=new Set(L0.map(e=>e.name)),list=(ALT[cat(cur)]||[]).filter(x=>x!=cur&&!used.has(x));PK={i,m,list};let el=document.getElementById("sheet");el.innerHTML=`<div class="sh"><b>Замена: ${esc(cur)}</b><div class="hsub" style="margin:4px 0 10px">${list.length?"Выберите вариант":"Готовых замен нет, введите свой вариант"}</div>${list.map((x,k)=>`<button class="alt" onclick="choose(${k})">${esc(x)}</button>`).join("")}<button class="alt" onclick="own()">Свой вариант…</button><button class="alt" onclick="closeSh()">Отмена</button></div>`;el.classList.remove("hidden")}
function closeSh(){PK=null;document.getElementById("sheet").classList.add("hidden")}
function choose(k){setName(PK.list[k])}
function own(){let n=(prompt("Название упражнения:")||"").trim();if(n)setName(n);else closeSh()}
function setName(n){let {i,m}=PK;if(m=="e")ED[i].name=n;else{let e=draft()[i],l=getLastExData(n);e.name=n;e.sets.forEach(x=>{x.weight=l?l.weight:0;x.reps=l?l.reps:"";x.done=false})}touch();closeSh();render()}
const BF=[["w","Вес, кг"],["ch","Грудь, см"],["wa","Талия, см"],["hp","Бёдра, см"],["ar","Рука, см"]];
const mergeB=(a,b)=>{let m=new Map();[...b,...a].forEach(x=>m.set(x.d,x));return[...m.values()].sort((x,y)=>x.d<y.d?1:-1)};
function fillProg(){program.innerHTML=Object.keys(P).map(x=>`<option>${esc(x)}</option>`).join("");program.value=S.program}
function lc(p){if(p.length<2)return'<div class="hsub" style="padding:10px 0">Для графика нужно минимум две записи</div>';let mx=Math.max(...p.map(x=>x.v)),mn=Math.min(...p.map(x=>x.v)),sp=mx-mn||1,W=300,H=80,q=p.map((x,i)=>[i/(p.length-1)*(W-40)+20,H-25-(x.v-mn)/sp*(H-45)]);return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${q.map(a=>a.join(",")).join(" ")}"/>${q.map((a,i)=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--accent)"/>`+((i==0||i==q.length-1)?`<text x="${a[0]}" y="${a[1]-8}" font-size="10" fill="#fff" text-anchor="middle">${p[i].v}</text>`:"")).join("")}</svg>`}
function bodyPage(){let B=S.body||[],t=lk(new Date()),td=B.find(x=>x.d===t)||{},m=S.bm||"w",ml=BF.find(f=>f[0]==m)[1],pts=[...B].reverse().filter(x=>x[m]).slice(-20).map(x=>({v:+x[m]}));
let h='<div class="card"><b>Сегодня</b><div class="bf">'+BF.map(([k,l])=>`<label>${l}<input id="b_${k}" type="number" step=".1" inputmode="decimal" value="${td[k]??""}"></label>`).join("")+'</div><button style="width:100%;margin-top:10px;background:var(--accent);color:#000;font-weight:700" onclick="saveBody()">Сохранить</button></div>';
h+='<div class="card"><div class="seg" style="flex-wrap:wrap">'+BF.map(([k,l])=>`<button class="${k==m?"active":""}" style="font:600 13px -apple-system,sans-serif;padding:8px" onclick="S.bm=\'${k}\';save();render()">${l.split(",")[0]}</button>`).join("")+`</div><div class="hsub" style="margin:10px 0 4px">${ml}</div>${lc(pts)}</div>`;
B.forEach((x,i)=>{h+=`<div class="hc"><div class="hc-top"><div><div class="hdate">${new Date(x.d+"T12:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}</div><div class="hsub">${BF.filter(f=>x[f[0]]).map(f=>f[1].split(",")[0]+" "+x[f[0]]).join(" • ")}</div></div><button class="htrash" onclick="delB(${i})" aria-label="Удалить">✕</button></div></div>`});
if(!B.length)h+='<div class="empty">Записей пока нет</div>';return h}
function saveBody(){let t=lk(new Date()),B=S.body||[],e={...(B.find(x=>x.d===t)||{d:t})},any=false;BF.forEach(([k])=>{let v=document.getElementById("b_"+k).value;if(v!==""){e[k]=+v;any=true}else delete e[k]});if(!any)return toast("Введите хотя бы одно значение");S.body=mergeB([e],B.filter(x=>x.d!==t));save();push();render();toast("Замеры сохранены")}
function delB(i){let x=S.body.splice(i,1)[0];save();push();render();toast("Запись удалена",()=>{S.body=mergeB(S.body,[x]);save();push();render()})}
function openEd(){ED=parse(P[S.program].days[S.day]).map(e=>({name:e.name,sets:e.sets,weight:e.weight,g:e.group?e.group.replace("SS",""):""}));S.page="edit";render()}
function editor(){let h=`<div class="hh"><b>${esc(S.program)} · день ${L[S.day]||S.day}</b></div>`;ED.forEach((e,i)=>{h+=`<div class="card"><input style="width:100%" value="${esc(e.name)}" placeholder="Название" onchange="ED[${i}].name=this.value"><div class="er"><label>Подходы<input type="number" inputmode="numeric" value="${esc(e.sets)}" onchange="ED[${i}].sets=this.value"></label><label>Вес / мин<input type="number" step=".5" inputmode="decimal" value="${esc(e.weight)}" onchange="ED[${i}].weight=this.value"></label><label>Суперсет<input type="number" inputmode="numeric" placeholder="нет" value="${esc(e.g)}" onchange="ED[${i}].g=this.value"></label><button onclick="pick(${i},'e')">⇄</button><button onclick="edMv(${i},-1)">↑</button><button onclick="edMv(${i},1)">↓</button><button class="danger" onclick="ED.splice(${i},1);render()">✕</button></div></div>`});
return h+'<button class="edbtn" onclick="ED.push({name:\'\',sets:3,weight:0,g:\'\'});render()">+ Упражнение</button><button class="edbtn" onclick="addDay()">+ День</button><button class="edbtn" onclick="newProg()">+ Новая программа</button><div class="ctr" style="margin-top:14px"><button onclick="ED=null;S.page=\'workout\';render()">Отмена</button><button style="background:var(--accent);color:#000;font-weight:700" onclick="edSave()">Сохранить</button></div>'}
function edMv(i,d){let j=i+d;if(j<0||j>=ED.length)return;[ED[i],ED[j]]=[ED[j],ED[i]];render()}
function edCommit(){let rows=[],gm={};ED.filter(e=>String(e.name).trim()).forEach(e=>{let g=String(e.g||"").trim(),n=e.name.trim(),a=[n,+e.sets||1,+e.weight||0];if(g&&!n.startsWith("Кардио")){let k="SS"+g;if(gm[k])gm[k].push(";",...a);else{gm[k]=[k,...a];rows.push(gm[k])}}else rows.push([...a,""])});P[S.program].days[S.day]=rows;S.progs=S.progs||{};S.progs[S.program]={days:P[S.program].days};Object.keys(S.drafts).forEach(k=>{if(k.startsWith(S.program+"|")&&k.endsWith("|"+S.day)){delete S.drafts[k];(S.dts=S.dts||{})[k]=Date.now()}});save();push()}
function edSave(){edCommit();ED=null;S.page="workout";render();toast("Программа сохранена")}
function addDay(){edCommit();let ds=P[S.program].days,k=["A","B","V","G"].find(x=>!ds[x]);if(!k)return toast("Максимум 4 дня");ds[k]=[["Кардио: Ходьба на дорожке",1,10,""]];S.progs[S.program]={days:ds};S.day=k;save();openEd()}
function newProg(){let n=(prompt("Название новой программы:")||"").trim();if(!n||P[n])return n&&toast("Такая программа уже есть");edCommit();P[n]={days:{A:[["Кардио: Ходьба на дорожке",1,10,""]]}};S.progs[n]=P[n];S.program=n;S.day="A";fillProg();save();openEd()}
function tgl(){showAuth=!showAuth;renderAuth()}
function logout(){token="";userEmail="";localStorage.removeItem("wd_token");localStorage.removeItem("wd_email");showAuth=false;setStatus("Выход выполнен. Данные сохраняются локально.");renderAuth();render()}
function lk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
</script></body></html>
