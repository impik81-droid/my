<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка — техника</title><style>:root{color-scheme:dark;--bg:#000;--card:#171719;--line:#303035;--accent:#c4f94d;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 16px 50px}h1{font-size:24px;margin:0 0 8px}p{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,button{font:inherit;border-radius:11px;padding:11px;border:1px solid var(--line);background:#232326;color:#fff;width:100%}button{cursor:pointer;background:var(--accent);color:#000;font-weight:700;border:0;margin-top:14px}.back{background:#232326;color:#fff}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 0}.item button{width:auto;margin:0;background:#3a171d;color:#ffb7bf;padding:7px 10px}.msg{min-height:22px;color:var(--accent);font-size:14px}.hide{display:none!important}</style></head><body><main class="wrap"><h1>Админка · Техника</h1><p>Загрузка видео доступна только администратору.</p><div id="loginCard" class="card"><b>Вход администратора</b><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="Ваш email"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Пароль"><button id="loginBtn">Войти</button><div id="loginMsg" class="msg"></div></div><div id="adminCard" class="card hide"><label>Упражнение</label><select id="exercise"><option value="">Загрузка списка упражнений…</option></select><label>Название видео</label><input id="title" placeholder="Техника выполнения"><label>Видео MP4, WebM или MOV, до 120 МБ</label><input id="file" type="file" accept="video/mp4,video/webm,video/quicktime"><button id="upload">Загрузить видео</button><div id="msg" class="msg"></div></div><div id="videosCard" class="card hide"><b>Загруженные видео</b><div id="list"></div></div><button class="back" onclick="location.href='/'">← Вернуться в приложение</button></main><script>let token=localStorage.getItem('wd_token')||'',msg=document.getElementById('msg');async function loadExercises(){try{let a=await fetch('exercise-options.json');let xs=await a.json();let e=document.getElementById('exercise');e.innerHTML='<option value="">Выберите упражнение</option>'+xs.map(x=>`<option>${esc(x)}</option>`).join('')}catch(_){msg.textContent='Не удалось загрузить список упражнений'}}function headers(){return token?{Authorization:'Bearer '+token}:{}}function setAdmin(on){document.getElementById('loginCard').classList.toggle('hide',on);document.getElementById('adminCard').classList.toggle('hide',!on);document.getElementById('videosCard').classList.toggle('hide',!on)}async function loginAdmin(){let email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,box=document.getElementById('loginMsg');if(!email||!password){box.textContent='Введите email и пароль';return}box.textContent='Вход…';try{let r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,password})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка входа');token=j.token;localStorage.setItem('wd_token',token);localStorage.setItem('wd_email',email);setAdmin(true);box.textContent='';await load()}catch(e){box.textContent=e.message}}async function load(){let r=await fetch('/api/videos');if(r.status===403){msg.textContent='Нет доступа'}let a=await r.json();document.getElementById('list').innerHTML=a.length?a.map(v=>`<div class="item"><span>${esc(v.exercise)}<small style="display:block;color:var(--muted)">${esc(v.title||'')}</small></span><button onclick="del('${v.id}')">Удалить</button></div>`).join(''):'<p>Видео пока нет</p>'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('loginBtn').onclick=loginAdmin;document.getElementById('upload').onclick=async()=>{let btn=document.getElementById('upload'),f=document.getElementById('file').files[0],ex=document.getElementById('exercise').value.trim();if(!f||!ex){msg.textContent='Укажите упражнение и выберите видео';return}if(f.size>120*1024*1024){msg.textContent='Файл больше 120 МБ';return}let d=new FormData();d.append('exercise',ex);d.append('title',document.getElementById('title').value.trim()||ex);d.append('file',f);btn.disabled=true;btn.textContent='Загрузка…';msg.textContent='Загрузка…';try{let r=await fetch('/api/admin/videos',{method:'POST',headers:headers(),body:d,signal:AbortSignal.timeout(180000)}),j=await r.json();msg.textContent=r.ok?'Видео загружено':(j.error||`Ошибка загрузки (${r.status})`);if(r.ok){document.getElementById('file').value='';load()}}catch(e){msg.textContent=e.name==='TimeoutError'?'Загрузка превысила 3 минуты':'Ошибка соединения с сервером'}finally{btn.disabled=false;btn.textContent='Загрузить видео'}};async function del(id){if(!confirm('Удалить видео?'))return;let r=await fetch('/api/admin/videos/'+id,{method:'DELETE',headers:headers()});msg.textContent=r.ok?'Видео удалено':(await r.text());load()}loadExercises();if(token){setAdmin(true);load()}else setAdmin(false);</script></body></html>
